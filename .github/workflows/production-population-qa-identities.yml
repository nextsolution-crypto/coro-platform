name: Production Population QA Identities

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coro-production-maintenance
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test ops/population/population-qa-identities-provision.test.cjs

  provision:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate pinned host identity
        env:
          HOST_FINGERPRINT: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
        run: '[[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]'
      - name: Provision fixed building-scoped identities and dispatch invitations once
        uses: appleboy/ssh-action@v1.0.3
        env:
          SOURCE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          envs: SOURCE_SHA
          script: |
            set -Eeuo pipefail
            repo=/opt/coro-platform
            script_path="$(mktemp /tmp/coro-population-qa-identities.XXXXXX.cjs)"
            evidence_path="$(mktemp /tmp/coro-population-qa-identities.XXXXXX.json)"
            trap 'rm -f -- "$script_path" "$evidence_path"' EXIT
            exec 9>/run/lock/coro-production-deployment.lock
            flock -n 9
            git -C "$repo" fetch --quiet origin main
            git -C "$repo" merge-base --is-ancestor "$SOURCE_SHA" origin/main
            git -C "$repo" show "$SOURCE_SHA:ops/population/population-qa-identities-provision.cjs" >"$script_path"
            cd "$repo"
            docker compose exec -T \
              -e CORO_POPULATION_QA_IDENTITIES_RUN=true \
              -e CORO_POPULATION_QA_IDENTITIES_APPROVAL=SP_OPS_04B_QA_IDENTITIES_2026_11_07 \
              backend node - <"$script_path" >"$evidence_path"
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.schemaVersion!==1||r.execution!=="PASS"||r.identityCount!==2||r.externalMessageCount!==2||r.liveAlertSent!==false||r.invitations.some(v=>v!=="DELIVERED")||r.buildingScopeCounts.some(v=>v!==1))process.exit(1);const s=JSON.stringify(r);if(/@|password|secret|token|destination|providerMessage/i.test(s))process.exit(1);' "$evidence_path"
            cat "$evidence_path"
