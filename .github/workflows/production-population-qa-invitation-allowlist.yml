name: Production Population QA Invitation Allowlist

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coro-production-maintenance
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test ops/population/population-qa-invitation-allowlist.test.cjs

  configure:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate pinned host identity
        env:
          HOST_FINGERPRINT: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
        run: '[[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]'
      - name: Add fixed hashes and reconcile backend once
        uses: appleboy/ssh-action@v1.0.3
        env:
          SOURCE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          envs: SOURCE_SHA
          script: |
            set -Eeuo pipefail
            umask 077
            repo=/opt/coro-platform
            env_file="$repo/.env"
            updater="$(mktemp /tmp/coro-population-qa-allowlist.XXXXXX.cjs)"
            backup="$(mktemp /tmp/coro-population-qa-env.XXXXXX)"
            evidence="$(mktemp /tmp/coro-population-qa-allowlist.XXXXXX.json)"
            changed=false
            restored=false
            cleanup() { rm -f -- "$updater" "$backup" "$evidence"; }
            restore() {
              status=$?
              if [[ "$status" -ne 0 && "$changed" == true ]]; then
                install -m 0600 -T "$backup" "$env_file"
                restored=true
                cd "$repo"
                docker compose up -d --no-deps --force-recreate backend >/dev/null || true
              fi
              cleanup
              exit "$status"
            }
            trap restore EXIT
            exec 9>/run/lock/coro-production-deployment.lock
            flock -n 9
            git -C "$repo" fetch --quiet origin main
            git -C "$repo" merge-base --is-ancestor "$SOURCE_SHA" origin/main
            [[ -f "$env_file" && ! -L "$env_file" ]]
            install -m 0600 -T "$env_file" "$backup"
            git -C "$repo" show "$SOURCE_SHA:ops/population/population-qa-invitation-allowlist.cjs" >"$updater"
            cd "$repo"
            [[ "$(docker inspect --format '{{.State.Running}}' coro_backend)" == true ]]
            docker exec coro_backend node -e 'if(process.env.POPULATION_CONTROLLED_LIVE_TEST_ENABLED!=="false"||process.env.POPULATION_CONTROLLED_LIVE_TEST_STOP!=="true")process.exit(1)'
            CORO_POPULATION_QA_ALLOWLIST_RUN=true \
              CORO_POPULATION_QA_ALLOWLIST_APPROVAL=SP_OPS_04B_QA_INVITATION_ALLOWLIST_2026_11_07 \
              node "$updater" "$env_file" >"$evidence"
            changed=true
            docker compose config --quiet
            docker compose up -d --no-deps --force-recreate backend >/dev/null
            healthy=false
            for _ in $(seq 1 40); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -H 'content-type: application/json' -d '{"email":"maintenance-smoke@example.invalid","password":"invalid"}' http://127.0.0.1:3002/api/auth/login || true)"
              if [[ "$code" =~ ^(400|401)$ ]]; then healthy=true; break; fi
              sleep 3
            done
            [[ "$healthy" == true ]]
            [[ "$(docker inspect --format '{{.RestartCount}}' coro_backend)" == 0 ]]
            docker exec coro_backend node - <<'NODE'
            const crypto=require('crypto');
            const values=(process.env.DEMO_AUTH_EMAIL_LIVE_RECIPIENT_SHA256_ALLOWLIST||'').split(',').map(v=>v.trim()).filter(Boolean);
            const required=['demo-sp-preparer@getcoro.io','demo-sp-approver@getcoro.io'].map(v=>crypto.createHash('sha256').update(v).digest('hex'));
            if(values.length!==4||new Set(values).size!==4||values.some(v=>!/[a-f0-9]{64}/.test(v))||required.some(v=>!values.includes(v)))process.exit(1);
            if(process.env.POPULATION_CONTROLLED_LIVE_TEST_ENABLED!=='false'||process.env.POPULATION_CONTROLLED_LIVE_TEST_STOP!=='true')process.exit(1);
            NODE
            node -e 'const r=require(process.argv[1]);if(r.schemaVersion!==1||r.execution!=="PASS"||r.finalCount!==4||r.exactTargetsPresent!==true)process.exit(1);const s=JSON.stringify(r);if(/@|[a-f0-9]{64}/i.test(s))process.exit(1)' "$evidence"
            cat "$evidence"
            changed=false
