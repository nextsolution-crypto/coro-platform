name: Production CORO Demo Report 03

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact governed phase
        required: true
        type: choice
        options: [preflight, provision, verify, enable, disable, rollback]
      approval:
        description: Exact phase-specific approval token
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coro-production-maintenance
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      script_sha256: ${{ steps.hash.outputs.script_sha256 }}
      manifest_sha256: ${{ steps.hash.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Validate governed request and tests
        env:
          PHASE: ${{ inputs.phase }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -Eeuo pipefail
          case "$PHASE:$APPROVAL" in
            preflight:PREFLIGHT_CORO_DEMO_REPORT_03|provision:PROVISION_CORO_DEMO_REPORT_03|verify:VERIFY_CORO_DEMO_REPORT_03|enable:ENABLE_CORO_DEMO_REPORT_03|disable:DISABLE_CORO_DEMO_REPORT_03|rollback:ROLLBACK_CORO_DEMO_REPORT_03) ;;
            *) exit 1 ;;
          esac
          node ops/client01d/coro-demo-report-03.test.cjs
      - id: hash
        run: |
          echo "script_sha256=$(sha256sum ops/client01d/coro-demo-report-03.cjs | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(sha256sum ops/client01d/coro-demo-report-03-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  execute:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Execute fixed tenant-scoped authority
        uses: appleboy/ssh-action@v1.0.3
        env:
          SOURCE_SHA: ${{ github.sha }}
          SCRIPT_SHA256: ${{ needs.validate.outputs.script_sha256 }}
          MANIFEST_SHA256: ${{ needs.validate.outputs.manifest_sha256 }}
          PHASE: ${{ inputs.phase }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          envs: SOURCE_SHA,SCRIPT_SHA256,MANIFEST_SHA256,PHASE,GITHUB_RUN_ID
          script: |
            set -Eeuo pipefail
            stage=initialize
            trap 'rc=$?; echo "CORO_DEMO_REPORT_03_WORKFLOW_FAILED stage=$stage rc=$rc"; exit "$rc"' ERR
            repo=/opt/coro-platform
            tmp="$(mktemp -d /tmp/coro-demo-report-03.XXXXXX)"
            backend=""
            container_tmp="/tmp/coro-demo-report-03-$GITHUB_RUN_ID"
            env_backup=""
            cleanup() {
              if [[ -n "$backend" ]]; then docker exec "$backend" rm -rf -- "$container_tmp" >/dev/null 2>&1 || true; fi
              rm -rf -- "$tmp"
            }
            trap cleanup EXIT
            stage=deployment_lock
            exec 9>/run/lock/coro-production-deployment.lock
            flock -n 9
            stage=source_integrity
            git -C "$repo" fetch --quiet origin main
            test "$(git -C "$repo" rev-parse origin/main)" = "$SOURCE_SHA"
            git -C "$repo" show "$SOURCE_SHA:ops/client01d/coro-demo-report-03.cjs" >"$tmp/script.cjs"
            git -C "$repo" show "$SOURCE_SHA:ops/client01d/coro-demo-report-03-manifest.json" >"$tmp/manifest.json"
            test "$(sha256sum "$tmp/script.cjs" | cut -d' ' -f1)" = "$SCRIPT_SHA256"
            test "$(sha256sum "$tmp/manifest.json" | cut -d' ' -f1)" = "$MANIFEST_SHA256"
            stage=backend_health
            backend="$(docker compose -f "$repo/docker-compose.yml" ps -q backend)"
            test -n "$backend"
            backend_ready() {
              local code
              [[ "$(docker inspect -f '{{.State.Running}}' "$backend" 2>/dev/null)" = true ]] || return 1
              [[ "$(docker inspect -f '{{.RestartCount}}' "$backend" 2>/dev/null)" = 0 ]] || return 1
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 -H 'content-type: application/json' -d '{"email":"release-smoke-nonexistent@example.invalid","password":"InvalidReleaseSmoke!123"}' http://127.0.0.1:3002/api/auth/login)" || return 1
              [[ "$code" =~ ^(400|401)$ ]]
            }
            backend_ready
            if [[ "$PHASE" != preflight && "$PHASE" != verify ]]; then
              stage=backup_restore
              systemctl start coro-db-backup.service
              test "$(systemctl show -p Result --value coro-db-backup.service)" = success
              systemctl start coro-db-restore-test.service
              test "$(systemctl show -p Result --value coro-db-restore-test.service)" = success
            fi
            stage=install_authority
            docker exec "$backend" mkdir -m 0700 "$container_tmp"
            docker cp "$tmp/script.cjs" "$backend:$container_tmp/coro-demo-report-03.cjs"
            docker cp "$tmp/manifest.json" "$backend:$container_tmp/coro-demo-report-03-manifest.json"
            run_script() {
              local exit_code=0
              docker exec -e CORO_DEMO_REPORT_03_RUN=true -e GITHUB_RUN_ID="$GITHUB_RUN_ID" "$backend" node "$container_tmp/coro-demo-report-03.cjs" "$1" >"$tmp/evidence.json" || exit_code=$?
              node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.schemaVersion!==1||!["PASS","FAIL"].includes(r.execution))process.exit(1);if(r.execution==="FAIL"&&!/^[A-Z][A-Z0-9_]{2,80}$/.test(r.errorCode||""))process.exit(1);if(/@|password|secret|token|access[_-]?key|private[_-]?key/i.test(JSON.stringify(r)))process.exit(1)' "$tmp/evidence.json"
              cat "$tmp/evidence.json"
              test "$exit_code" -eq 0
              node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.execution!=="PASS")process.exit(1)' "$tmp/evidence.json"
            }
            set_flag() {
              local desired="$1"
              local env_file="$repo/.env"
              local release_root=/opt/coro-ops/releases
              local marker manifest expected_sha expected_backend active_image override
              marker="$(find "$release_root/state" -maxdepth 1 -type f -name 'production-*.reconciled.json' -printf '%T@ %p\n' | sort -rn | sed -n '1p' | cut -d' ' -f2-)"
              [[ -n "$marker" && -f "$marker" && ! -L "$marker" ]]
              manifest="$(node -e 'const fs=require("fs"),m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.manifestPath||"")' "$marker")"
              expected_sha="$(node -e 'const fs=require("fs"),m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.manifestSha256||"")' "$marker")"
              [[ -f "$manifest" && ! -L "$manifest" && "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
              [[ "$(sha256sum "$manifest" | cut -d' ' -f1)" == "$expected_sha" ]]
              expected_backend="$(node -e 'const fs=require("fs"),m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.images?.backend||"")' "$manifest")"
              [[ "$expected_backend" =~ ^ghcr\.io/nextsolution-crypto/coro-backend@sha256:[0-9a-f]{64}$ ]]
              active_image="$(docker inspect --format '{{.Image}}' "$backend")"
              docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$active_image" | grep -Fxq "$expected_backend" || { echo 'CORO_DEMO_REPORT_03_FAILED code=ACTIVE_BACKEND_RELEASE_MISMATCH'; return 1; }
              docker manifest inspect "$expected_backend" >/dev/null
              override="$tmp/backend-immutable.yml"
              printf 'services:\n  backend:\n    image: %s\n' "$expected_backend" >"$override"
              chmod 0600 "$override"
              env_backup="$tmp/env.backup"
              cp --preserve=mode,ownership,timestamps "$env_file" "$env_backup"
              awk -v desired="$desired" 'BEGIN{done=0} /^INCIDENT_REPORTS_ENABLED=/{if(!done){print "INCIDENT_REPORTS_ENABLED=" desired;done=1}next} {print} END{if(!done)print "INCIDENT_REPORTS_ENABLED=" desired}' "$env_file" >"$tmp/env.new"
              chown --reference="$env_file" "$tmp/env.new"
              chmod --reference="$env_file" "$tmp/env.new"
              mv "$tmp/env.new" "$env_file"
              apply_runtime() {
                docker compose -f "$repo/docker-compose.yml" -f "$override" up -d --no-deps --no-build backend
                backend="$(docker compose -f "$repo/docker-compose.yml" -f "$override" ps -q backend)"
                for _ in $(seq 1 30); do backend_ready && break; sleep 2; done
                backend_ready
                docker exec "$backend" node -e 'const expected=process.argv[1];const names=["INCIDENT_REPORTS_ENABLED","OPERATIONAL_LOG_ENABLED","OPERATIONAL_SHIFTS_ENABLED","OPERATIONAL_DIRECTIVES_ENABLED","OPERATIONAL_FOLLOWUPS_ENABLED"];const state=Object.fromEntries(names.map(n=>[n,process.env[n]==="true"]));if(state.INCIDENT_REPORTS_ENABLED!==(expected==="true")||state.OPERATIONAL_LOG_ENABLED||state.OPERATIONAL_SHIFTS_ENABLED||state.OPERATIONAL_DIRECTIVES_ENABLED||state.OPERATIONAL_FOLLOWUPS_ENABLED)process.exit(1);console.log(JSON.stringify({schemaVersion:1,execution:"PASS",flags:state}))' "$desired"
              }
              if ! apply_runtime; then
                cp --preserve=mode,ownership,timestamps "$env_backup" "$env_file"
                docker compose -f "$repo/docker-compose.yml" -f "$override" up -d --no-deps --no-build backend
                exit 1
              fi
              docker exec "$backend" mkdir -m 0700 "$container_tmp"
              docker cp "$tmp/script.cjs" "$backend:$container_tmp/coro-demo-report-03.cjs"
              docker cp "$tmp/manifest.json" "$backend:$container_tmp/coro-demo-report-03-manifest.json"
            }
            case "$PHASE" in
              preflight) stage=preflight; run_script preflight ;;
              provision) stage=provision_preflight; run_script preflight; stage=provision; run_script provision; stage=provision_verify; run_script verify ;;
              verify) stage=verify; run_script verify ;;
              enable) stage=enable_verify; run_script verify; stage=enable_flag; set_flag true ;;
              disable) stage=disable_flag; set_flag false ;;
              rollback) stage=rollback_flag; set_flag false; stage=rollback_data; run_script rollback ;;
            esac
