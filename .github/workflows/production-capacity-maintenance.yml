name: Governed Production Capacity Maintenance

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: DRY_RUN or EXECUTE
        required: true
        type: choice
        options: [DRY_RUN, EXECUTE]
      cleanup_approval:
        description: For a reviewed manual EXECUTE type EXECUTE_REVIEWED_RETENTION_POLICY
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: coro-production-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          bash -n ops/capacity/coro-capacity-cleanup.sh
          node --test ops/capacity/*.test.mjs
  maintain:
    needs: validate
    if: ${{ github.event_name != 'schedule' || vars.CORO_RELEASE_RETENTION_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate request
        env:
          MODE: ${{ inputs.mode || 'EXECUTE' }}
          APPROVAL: ${{ inputs.cleanup_approval }}
          AUTOMATION_ENABLED: ${{ vars.CORO_RELEASE_RETENTION_AUTOMATION_ENABLED }}
        run: |
          [[ "$MODE" == DRY_RUN || "$MODE" == EXECUTE ]]
          if [[ "$MODE" == EXECUTE ]]; then
            [[ "$AUTOMATION_ENABLED" == true ]]
            [[ "${{ github.event_name }}" == schedule || "$APPROVAL" == EXECUTE_REVIEWED_RETENTION_POLICY ]]
          fi
      - name: Validate pinned host identity
        env:
          HOST_FINGERPRINT: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
        run: '[[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]'
      - name: Execute governed capacity maintenance
        uses: appleboy/ssh-action@v1.0.3
        env:
          SOURCE_SHA: ${{ github.sha }}
          CAPACITY_CLEANUP_MODE: ${{ inputs.mode || 'EXECUTE' }}
          CAPACITY_CLEANUP_APPROVAL: ${{ github.event_name == 'schedule' && 'EXECUTE_REVIEWED_RETENTION_POLICY' || inputs.cleanup_approval }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          envs: SOURCE_SHA,CAPACITY_CLEANUP_MODE,CAPACITY_CLEANUP_APPROVAL
          script: |
            set -Eeuo pipefail
            repo=/opt/coro-platform
            script="$(mktemp /tmp/coro-capacity-cleanup.XXXXXX.sh)"
            plan="$(mktemp /tmp/coro-release-retention-plan.XXXXXX.mjs)"
            policy="$(mktemp /tmp/coro-release-retention-policy.XXXXXX.json)"
            trap 'rm -f -- "$script" "$plan" "$policy"' EXIT
            git -C "$repo" fetch --quiet origin main
            git -C "$repo" fetch --quiet origin "$SOURCE_SHA"
            [[ "$CAPACITY_CLEANUP_MODE" == DRY_RUN ]] || test "$(git -C "$repo" rev-parse origin/main)" = "$SOURCE_SHA"
            git -C "$repo" show "$SOURCE_SHA:ops/capacity/coro-capacity-cleanup.sh" >"$script"
            git -C "$repo" show "$SOURCE_SHA:ops/capacity/release-retention-plan.mjs" >"$plan"
            git -C "$repo" show "$SOURCE_SHA:ops/capacity/release-retention-policy.json" >"$policy"
            bash -n "$script"
            chmod 0700 "$script"
            CORO_RETENTION_PLAN_TOOL="$plan" CORO_RETENTION_POLICY_FILE="$policy" "$script"
