name: Production CORO Demo Report 2.0 Templates

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact governed phase
        required: true
        type: choice
        options: [preflight, extend, verify, rollback]
      approval:
        description: Exact phase-specific approval token
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coro-production-maintenance
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      script_sha256: ${{ steps.hash.outputs.script_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Validate governed request and tests
        env:
          PHASE: ${{ inputs.phase }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -Eeuo pipefail
          case "$PHASE:$APPROVAL" in
            preflight:PREFLIGHT_EXISTING_REPORT_TEMPLATES|extend:EXTEND_EXISTING_REPORT_TEMPLATES|verify:VERIFY_EXISTING_REPORT_TEMPLATES|rollback:ROLLBACK_EXISTING_REPORT_TEMPLATES) ;;
            *) exit 1 ;;
          esac
          node ops/client01d/coro-demo-report-20-templates.test.cjs
      - id: hash
        run: echo "script_sha256=$(sha256sum ops/client01d/coro-demo-report-20-templates.cjs | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  execute:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Execute tenant-scoped template extension
        uses: appleboy/ssh-action@v1.0.3
        env:
          SOURCE_SHA: ${{ github.sha }}
          SCRIPT_SHA256: ${{ needs.validate.outputs.script_sha256 }}
          PHASE: ${{ inputs.phase }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          envs: SOURCE_SHA,SCRIPT_SHA256,PHASE,GITHUB_RUN_ID
          script: |
            set -Eeuo pipefail
            stage=initialize
            trap 'rc=$?; echo "CORO_DEMO_REPORT_20_WORKFLOW_FAILED stage=$stage rc=$rc"; exit "$rc"' ERR
            repo=/opt/coro-platform
            tmp="$(mktemp -d /tmp/coro-demo-report-20.XXXXXX)"
            backend=""
            container_tmp="/tmp/coro-demo-report-20-$GITHUB_RUN_ID"
            cleanup() {
              if [[ -n "$backend" ]]; then docker exec "$backend" rm -rf -- "$container_tmp" >/dev/null 2>&1 || true; fi
              rm -rf -- "$tmp"
            }
            trap cleanup EXIT
            stage=deployment_lock
            exec 9>/run/lock/coro-production-deployment.lock
            flock -n 9
            stage=source_integrity
            git -C "$repo" fetch --quiet origin main
            test "$(git -C "$repo" rev-parse origin/main)" = "$SOURCE_SHA"
            git -C "$repo" show "$SOURCE_SHA:ops/client01d/coro-demo-report-20-templates.cjs" >"$tmp/script.cjs"
            test "$(sha256sum "$tmp/script.cjs" | cut -d' ' -f1)" = "$SCRIPT_SHA256"
            stage=backend_health
            backend="$(docker compose -f "$repo/docker-compose.yml" ps -q backend)"
            test -n "$backend"
            test "$(docker inspect -f '{{.State.Running}}' "$backend")" = true
            test "$(docker inspect -f '{{.RestartCount}}' "$backend")" = 0
            test "$(docker exec "$backend" sh -c 'printf %s "$INCIDENT_REPORTS_ENABLED"')" = true
            test "$(docker exec "$backend" sh -c 'printf %s "$INCIDENT_REPORT_ATTACHMENTS_ENABLED"')" = false
            test "$(docker exec "$backend" sh -c 'printf %s "$INCIDENT_REPORT_IMPORT_ENABLED"')" = false
            test "$(docker exec "$backend" sh -c 'printf %s "${INCIDENT_REPORT_ARCHIVES_ENABLED:-false}"')" = false
            if [[ "$PHASE" = extend || "$PHASE" = rollback ]]; then
              stage=backup_restore
              systemctl start coro-db-backup.service
              test "$(systemctl show -p Result --value coro-db-backup.service)" = success
              systemctl start coro-db-restore-test.service
              test "$(systemctl show -p Result --value coro-db-restore-test.service)" = success
            fi
            stage=install_authority
            docker exec "$backend" mkdir -m 0700 "$container_tmp"
            docker cp "$tmp/script.cjs" "$backend:$container_tmp/coro-demo-report-20-templates.cjs"
            run_script() {
              local exit_code=0
              docker exec -e CORO_DEMO_REPORT_20_RUN=true -e GITHUB_RUN_ID="$GITHUB_RUN_ID" "$backend" node "$container_tmp/coro-demo-report-20-templates.cjs" "$1" >"$tmp/evidence.json" || exit_code=$?
              node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.schemaVersion!==1||!["PASS","FAIL"].includes(r.execution))process.exit(1);if(r.execution==="FAIL"&&!/^[A-Z][A-Z0-9_]{2,100}$/.test(r.errorCode||""))process.exit(1);if(/@|password|secret|token|access[_-]?key|private[_-]?key/i.test(JSON.stringify(r)))process.exit(1)' "$tmp/evidence.json"
              cat "$tmp/evidence.json"
              test "$exit_code" -eq 0
              node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.execution!=="PASS")process.exit(1)' "$tmp/evidence.json"
            }
            case "$PHASE" in
              preflight) stage=preflight; run_script preflight ;;
              extend) stage=extend_preflight; run_script preflight; stage=extend; run_script extend; stage=extend_verify; run_script verify ;;
              verify) stage=verify; run_script verify ;;
              rollback) stage=rollback; run_script rollback ;;
            esac
