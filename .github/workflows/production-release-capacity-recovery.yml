name: Production Release Capacity Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan or governed execution of the canonical retention policy
        required: true
        type: choice
        options: [DRY_RUN, APPLY]
      candidate_commit:
        description: Approved immutable product SHA whose images must be protected
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coro-production-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.candidate.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve approved immutable candidate
        id: candidate
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          node - <<'NODE'
          const fs=require('fs');
          const releases=JSON.parse(fs.readFileSync('ops/deploy/approved-immutable-releases.json','utf8'));
          const commit=process.env.CANDIDATE_COMMIT;
          const release=releases.releases?.[commit];
          if(!release?.images) process.exit(1);
          const images=['backend','frontend','clientPortal','website'].map((key)=>release.images[key]);
          if(images.some((value)=>!/^ghcr\.io\/nextsolution-crypto\/coro-[a-z0-9_.-]+@sha256:[0-9a-f]{64}$/.test(value))) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`images=${images.join('|')}\n`);
          NODE
          bash -n ops/capacity/coro-capacity-cleanup.sh
          node --test ops/capacity/*.test.mjs ops/deploy/capacity-recovery-workflow.test.mjs

  recover:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'DRY_RUN' && 'production-inspection' || 'production' }}
    steps:
      - name: Validate pinned host identity
        env:
          HOST_FINGERPRINT: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
        run: '[[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]'
      - name: Execute canonical active-plus-rollback retention policy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SOURCE_SHA: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_IMAGES: ${{ needs.validate.outputs.images }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          command_timeout: 20m
          envs: SOURCE_SHA,MODE,CANDIDATE_COMMIT,CANDIDATE_IMAGES
          script: |
            set -Eeuo pipefail
            repo=/opt/coro-platform
            tmp="$(mktemp -d /tmp/coro-release-capacity.XXXXXX)"
            trap 'rm -rf -- "$tmp"' EXIT
            exec 8>/run/lock/coro-release-control.lock
            flock --nonblock 8
            git -C "$repo" fetch --quiet origin main
            test "$(git -C "$repo" rev-parse origin/main)" = "$SOURCE_SHA"
            for file in coro-capacity-cleanup.sh release-retention-plan.mjs release-retention-policy.json; do
              git -C "$repo" show "$SOURCE_SHA:ops/capacity/$file" >"$tmp/$file"
            done
            chmod 0700 "$tmp/coro-capacity-cleanup.sh"
            chmod 0600 "$tmp/release-retention-policy.json"
            IFS='|' read -r -a candidate_refs <<<"$CANDIDATE_IMAGES"
            (( ${#candidate_refs[@]} == 4 ))
            for ref in "${candidate_refs[@]}"; do
              [[ "$ref" =~ ^ghcr\.io/nextsolution-crypto/coro-[a-z0-9_.-]+@sha256:[0-9a-f]{64}$ ]]
              docker manifest inspect "$ref" >/dev/null
            done
            node - "$tmp/release-retention-policy.json" "$CANDIDATE_COMMIT" "${candidate_refs[@]}" <<'NODE'
            const fs=require('fs');
            const [file,commit,...images]=process.argv.slice(2);
            const policy=JSON.parse(fs.readFileSync(file,'utf8'));
            policy.explicitCandidates=[...(policy.explicitCandidates||[]),{
              id:`release-${commit}`,
              reason:'approved immutable release capacity recovery',
              expiresAt:new Date(Date.now()+24*60*60*1000).toISOString(),
              images,
            }];
            fs.writeFileSync(file,JSON.stringify(policy,null,2));
            NODE
            before="$(df -Pk -- /opt/coro-ops/releases | awk 'NR==2 {print $4*1024}')"
            if [[ "$MODE" == APPLY ]]; then
              cleanup_mode=EXECUTE
              cleanup_approval=EXECUTE_REVIEWED_RETENTION_POLICY
            else
              cleanup_mode=DRY_RUN
              cleanup_approval=''
            fi
            CORO_REPO="$repo" \
            CAPACITY_CLEANUP_MODE="$cleanup_mode" \
            CAPACITY_CLEANUP_APPROVAL="$cleanup_approval" \
            CORO_RETENTION_PLAN_TOOL="$tmp/release-retention-plan.mjs" \
            CORO_RETENTION_POLICY_FILE="$tmp/release-retention-policy.json" \
              "$tmp/coro-capacity-cleanup.sh"
            after="$(df -Pk -- /opt/coro-ops/releases | awk 'NR==2 {print $4*1024}')"
            printf 'RELEASE_CAPACITY_RECOVERY mode=%s beforeFreeBytes=%s afterFreeBytes=%s physicallyRecoveredBytes=%s volumesDeleted=false backupsDeleted=false activeAndRollbackProtected=true candidateProtected=true\n' \
              "$MODE" "$before" "$after" "$((after-before))"
