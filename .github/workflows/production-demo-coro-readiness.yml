name: Production Demo Coro Readiness Inventory

on:
  workflow_dispatch:
    inputs:
      display09_building_identity:
        description: Type RESOLVE_DISPLAY09_BUILDING_READ_ONLY to execute the fixed Display inventory
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: coro-production-maintenance
  cancel-in-progress: false

jobs:
  display09-building-identity:
    if: inputs.display09_building_identity == 'RESOLVE_DISPLAY09_BUILDING_READ_ONLY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test ops/display/display09-building-identity.test.cjs
      - name: Execute fixed read-only Display building inventory
        uses: appleboy/ssh-action@v1.0.3
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          envs: WORKFLOW_SHA
          script: |
            set -Eeuo pipefail
            repo=/opt/coro-platform
            script_path="$(mktemp /tmp/display09-building.XXXXXX.cjs)"
            output_path="$(mktemp /tmp/display09-building.XXXXXX.json)"
            evidence_dir="$repo/.inspection-evidence"
            evidence_path="$evidence_dir/display09-building-identity.json"
            trap 'rm -f -- "$script_path" "$output_path"' EXIT
            git -C "$repo" fetch --quiet origin "$WORKFLOW_SHA"
            git -C "$repo" show "$WORKFLOW_SHA:ops/display/display09-building-identity.cjs" >"$script_path"
            install -d -m 0700 "$evidence_dir"
            cd "$repo"
              if ! docker compose exec -T \
                -e DISPLAY09_BUILDING_INVENTORY_RUN=true \
                -e DISPLAY09_SECURE_EVIDENCE_PATH=/tmp/display09-building-identity.json \
                backend node - <"$script_path" >"$output_path"; then
                cat "$output_path"
                exit 1
              fi
              node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.execution!=="PASS"||r.readOnly!==true||r.clientCardinality!==1||r.buildingCardinality!==1||r.clientActive!==true||r.active!==true||r.demo!==true||r.buildingFictitious!==true||r.postMigrationDisplayGate!=="REQUIRED")process.exit(1);if(/building-1|client-1|@/.test(JSON.stringify(r)))process.exit(1)' "$output_path"
              docker compose cp backend:/tmp/display09-building-identity.json "$evidence_path"
              docker compose exec -T backend rm -f /tmp/display09-building-identity.json
              chmod 0600 "$evidence_path"
            cat "$output_path"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test ops/demo/demo-coro-readiness-inventory.test.cjs

  inventory:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate pinned host identity
        env:
          HOST_FINGERPRINT: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
        run: '[[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]'
      - name: Execute fixed read-only Demo Coro inventory
        uses: appleboy/ssh-action@v1.0.3
        env:
          SOURCE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          envs: SOURCE_SHA
          script: |
            set -Eeuo pipefail
            repo=/opt/coro-platform
            script_path="$(mktemp /tmp/coro-demo-readiness.XXXXXX.cjs)"
            evidence_path="$(mktemp /tmp/coro-demo-readiness.XXXXXX.json)"
            trap 'rm -f -- "$script_path" "$evidence_path"' EXIT
            git -C "$repo" fetch --quiet origin main
            git -C "$repo" merge-base --is-ancestor "$SOURCE_SHA" origin/main
            git -C "$repo" show "$SOURCE_SHA:ops/demo/demo-coro-readiness-inventory.cjs" >"$script_path"
            cd "$repo"
            docker compose exec -T -e CORO_DEMO_READINESS_INVENTORY_RUN=true backend node - <"$script_path" >"$evidence_path"
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.schemaVersion!==1||r.execution!=="PASS"||r.readOnly!==true)process.exit(1);const s=JSON.stringify(r);if(/demo@getcoro\.io|password|secret|token|access[_-]?key|private[_-]?key|canonical-user/i.test(s))process.exit(1);' "$evidence_path"
            cat "$evidence_path"
      - name: Record evidence boundary
        if: always()
        run: echo 'The explicitly requested canonical organization identity, project ownership results, fingerprints, roles, booleans and aggregate counts are emitted; user identifiers, document content and credentials remain undisclosed.'
