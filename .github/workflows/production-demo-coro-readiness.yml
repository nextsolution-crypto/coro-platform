name: Production Demo Coro Readiness Inventory

on:
  workflow_dispatch:
    inputs:
      display09_building_identity:
        description: Type RESOLVE_DISPLAY09_BUILDING_READ_ONLY to execute the fixed Display inventory
        required: false
        type: string
      display09_fixture_registration:
        description: Type REGISTER_TOUR_PREMONT_DEMO_FIXTURE to register only the canonical demo building
        required: false
        type: string
      display09_origin_inspection:
        description: Type INSPECT_DISPLAY09_ORIGIN_READ_ONLY to inspect origin TLS and routing without changes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: coro-production-maintenance
  cancel-in-progress: false

jobs:
  display09-origin-inspection:
    if: inputs.display09_origin_inspection == 'INSPECT_DISPLAY09_ORIGIN_READ_ONLY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect origin certificate and Display routing without mutation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          script: |
            set -Eeuo pipefail
            repo=/opt/coro-platform
            container_ids="$(docker compose -f "$repo/docker-compose.yml" ps -q | sort)"
            test -n "$container_ids"
            snapshot() { for id in $container_ids; do docker inspect --format '{{.Id}}:{{.State.Status}}:{{.RestartCount}}' "$id"; done | sort | sha256sum | cut -d' ' -f1; }
            before="$(snapshot)"
            portal="$(docker compose -f "$repo/docker-compose.yml" ps -q client-portal)"
            app_status=NOT_VERIFIED
            app_http_status=0
            app_no_store=false
            if [[ -n "$portal" ]] && curl --silent --show-error --max-time 10 --output /dev/null --dump-header /tmp/display09-app-headers.txt --header 'Host: display.getcoro.io' http://127.0.0.1:3003/d/nonexistent-display-id; then
              app_http_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code+0}' /tmp/display09-app-headers.txt)"
              if grep -Eiq '^cache-control:.*no-store' /tmp/display09-app-headers.txt; then app_no_store=true; fi
              if [[ "$app_http_status" == 404 && "$app_no_store" == true ]]; then app_status=PASS; else app_status=FAIL; fi
            fi
            rm -f /tmp/display09-app-headers.txt
            tls_status=NOT_VERIFIED
            tls_enddate=""
            tls_san_match=false
            if timeout 10 openssl s_client -connect 127.0.0.1:443 -servername display.getcoro.io </dev/null > /tmp/display09-tls.txt 2>/dev/null; then
              cert="$(openssl x509 -noout -enddate -ext subjectAltName </tmp/display09-tls.txt 2>/dev/null || true)"
              tls_enddate="$(printf '%s\n' "$cert" | sed -n 's/^notAfter=//p')"
              if printf '%s\n' "$cert" | grep -Eq 'DNS:(\*\.)?getcoro\.io([,[:space:]]|$)|DNS:display\.getcoro\.io([,[:space:]]|$)'; then tls_san_match=true; fi
              if [[ -n "$tls_enddate" && "$tls_san_match" == true ]] && openssl x509 -checkend 2592000 -noout </tmp/display09-tls.txt >/dev/null 2>&1; then tls_status=PASS; else tls_status=FAIL; fi
            fi
            rm -f /tmp/display09-tls.txt
            after="$(snapshot)"
            runtime_unchanged=false
            if [[ "$before" == "$after" ]]; then runtime_unchanged=true; fi
            printf '{"schemaVersion":1,"execution":"PASS","readOnly":true,"appRouting":"%s","appHttpStatus":%s,"appNoStore":%s,"originTls":"%s","originTlsExpiry":"%s","originSanMatches":%s,"runtimeUnchanged":%s}\n' "$app_status" "$app_http_status" "$app_no_store" "$tls_status" "$tls_enddate" "$tls_san_match" "$runtime_unchanged"

  display09-fixture-registration:
    if: inputs.display09_fixture_registration == 'REGISTER_TOUR_PREMONT_DEMO_FIXTURE'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test ops/display/display09-demo-fixture-registration.test.cjs ops/display/display09-building-identity.test.cjs
      - name: Register only the pinned canonical demo building fixture
        uses: appleboy/ssh-action@v1.0.3
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          envs: WORKFLOW_SHA,GITHUB_RUN_ID
          script: |
            set -Eeuo pipefail
            repo=/opt/coro-platform
            script_path="$(mktemp /tmp/display09-fixture.XXXXXX.cjs)"
            output_path="$(mktemp /tmp/display09-fixture.XXXXXX.json)"
            trap 'rm -f -- "$script_path" "$output_path"' EXIT
            exec 9>/run/lock/coro-production-deployment.lock
            flock -n 9
            git -C "$repo" fetch --quiet origin main
            test "$(git -C "$repo" rev-parse origin/main)" = "$WORKFLOW_SHA"
            git -C "$repo" show "$WORKFLOW_SHA:ops/display/display09-demo-fixture-registration.cjs" >"$script_path"
            cd "$repo"
            systemctl start coro-db-backup.service
            test "$(systemctl show -p Result --value coro-db-backup.service)" = success
            docker compose exec -T -e DISPLAY09_FIXTURE_REGISTRATION_RUN=true -e GITHUB_RUN_ID="$GITHUB_RUN_ID" backend node - <"$script_path" >"$output_path"
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.execution!=="PASS"||r.registryOnly!==true||r.reversible!==true||r.activeFixtureCount!==1||r.postMigrationDisplayGate!=="REQUIRED")process.exit(1);' "$output_path"
            cat "$output_path"

  display09-building-identity:
    if: inputs.display09_building_identity == 'RESOLVE_DISPLAY09_BUILDING_READ_ONLY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test ops/display/display09-building-identity.test.cjs
      - name: Execute fixed read-only Display building inventory
        uses: appleboy/ssh-action@v1.0.3
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          envs: WORKFLOW_SHA
          script: |
            set -Eeuo pipefail
            repo=/opt/coro-platform
            script_path="$(mktemp /tmp/display09-building.XXXXXX.cjs)"
            output_path="$(mktemp /tmp/display09-building.XXXXXX.json)"
            evidence_dir="$repo/.inspection-evidence"
            evidence_path="$evidence_dir/display09-building-identity.json"
            trap 'rm -f -- "$script_path" "$output_path"' EXIT
            git -C "$repo" fetch --quiet origin "$WORKFLOW_SHA"
            git -C "$repo" show "$WORKFLOW_SHA:ops/display/display09-building-identity.cjs" >"$script_path"
            install -d -m 0700 "$evidence_dir"
            cd "$repo"
              if ! docker compose exec -T \
                -e DISPLAY09_BUILDING_INVENTORY_RUN=true \
                -e DISPLAY09_SECURE_EVIDENCE_PATH=/tmp/display09-building-identity.json \
                backend node - <"$script_path" >"$output_path"; then
                cat "$output_path"
                exit 1
              fi
              cat "$output_path"
              node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.execution!=="PASS"||r.readOnly!==true||r.clientCardinality!==1||r.buildingCardinality!==1||r.clientActive!==true||r.active!==true||r.demo!==true||r.buildingFictitious!==true||r.postMigrationDisplayGate!=="REQUIRED")process.exit(1);if(/building-1|client-1|@/.test(JSON.stringify(r)))process.exit(1)' "$output_path"
              docker compose cp backend:/tmp/display09-building-identity.json "$evidence_path"
              docker compose exec -T backend rm -f /tmp/display09-building-identity.json
              chmod 0600 "$evidence_path"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test ops/demo/demo-coro-readiness-inventory.test.cjs

  inventory:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate pinned host identity
        env:
          HOST_FINGERPRINT: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
        run: '[[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]'
      - name: Execute fixed read-only Demo Coro inventory
        uses: appleboy/ssh-action@v1.0.3
        env:
          SOURCE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_ECDSA_HOST_FINGERPRINT }}
          envs: SOURCE_SHA
          script: |
            set -Eeuo pipefail
            repo=/opt/coro-platform
            script_path="$(mktemp /tmp/coro-demo-readiness.XXXXXX.cjs)"
            evidence_path="$(mktemp /tmp/coro-demo-readiness.XXXXXX.json)"
            trap 'rm -f -- "$script_path" "$evidence_path"' EXIT
            git -C "$repo" fetch --quiet origin main
            git -C "$repo" merge-base --is-ancestor "$SOURCE_SHA" origin/main
            git -C "$repo" show "$SOURCE_SHA:ops/demo/demo-coro-readiness-inventory.cjs" >"$script_path"
            cd "$repo"
            docker compose exec -T -e CORO_DEMO_READINESS_INVENTORY_RUN=true backend node - <"$script_path" >"$evidence_path"
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.schemaVersion!==1||r.execution!=="PASS"||r.readOnly!==true)process.exit(1);const s=JSON.stringify(r);if(/demo@getcoro\.io|password|secret|token|access[_-]?key|private[_-]?key|canonical-user/i.test(s))process.exit(1);' "$evidence_path"
            cat "$evidence_path"
      - name: Record evidence boundary
        if: always()
        run: echo 'The explicitly requested canonical organization identity, project ownership results, fingerprints, roles, booleans and aggregate counts are emitted; user identifiers, document content and credentials remain undisclosed.'
