name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [coro-backend, coro-frontend, coro-client-portal, coro-website]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Type check
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit --incremental false

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coro_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coro-backend/package-lock.json

      - name: Install dependencies
        working-directory: coro-backend
        run: npm ci

      - name: Apply migrations to test database
        working-directory: coro-backend
        run: npx prisma migrate deploy

      - name: Run backend tests
        working-directory: coro-backend
        run: npx jest --runInBand

      - name: Run PostgreSQL integration tests
        working-directory: coro-backend
        run: npm run test:postgres

  client-portal-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coro-client-portal/package-lock.json

      - name: Install dependencies
        working-directory: coro-client-portal
        run: npm ci

      - name: Build client portal
        working-directory: coro-client-portal
        run: npm run build

  build-and-push:
    needs: [typecheck, backend-tests, client-portal-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./coro-backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coro-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./coro-frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coro-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.getcoro.io/api

      - name: Build and push website
        uses: docker/build-push-action@v5
        with:
          context: ./coro-website
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coro-website:latest

      - name: Build and push client-portal
        uses: docker/build-push-action@v5
        with:
          context: ./coro-client-portal
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coro-client-portal:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.getcoro.io/api

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd /opt/coro-platform
            git pull
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker compose exec -T backend node -e "const{execSync}=require('child_process');execSync('npx prisma@6.19.3 migrate deploy --schema=/app/prisma/schema.prisma',{stdio:'inherit',env:{...process.env,npm_config_yes:'true'}})"
