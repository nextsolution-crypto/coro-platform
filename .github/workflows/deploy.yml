name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./coro-backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coro-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./coro-frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coro-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.getcoro.io/api

      - name: Build and push website
        uses: docker/build-push-action@v5
        with:
          context: ./coro-website
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coro-website:latest

      - name: Build and push client-portal
        uses: docker/build-push-action@v5
        with:
          context: ./coro-client-portal
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coro-client-portal:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.getcoro.io/api

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd /opt/coro-platform
            git pull
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker compose exec -T backend node -e "const{execSync}=require('child_process');execSync('npx prisma@6.19.3 migrate deploy --schema=/app/prisma/schema.prisma',{stdio:'inherit',env:{...process.env,npm_config_yes:'true'}})"