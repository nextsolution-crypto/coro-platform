name: Validate and Release Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full 40-character commit SHA already present on main
        required: true
        type: string
      production_approval:
        description: Type DEPLOY_PRODUCTION to authorize the protected release job
        required: true
        type: string
      migration_compatibility_approval:
        description: Type CONFIRMED_BACKWARD_COMPATIBLE after reviewing migrations against the running release
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [coro-backend, coro-frontend, coro-client-portal, coro-website]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Validate SMS evidence persistence mount
        if: matrix.app == 'coro-backend'
        shell: bash
        run: docker compose config --format json | node ops/sms-validation/verify-compose-mount.mjs

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Type check
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit --incremental false

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coro_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coro_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coro-backend/package-lock.json

      - name: Install dependencies
        working-directory: coro-backend
        run: npm ci

      - name: Apply migrations to test database
        working-directory: coro-backend
        run: npx prisma migrate deploy

      - name: Install local OCR runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng

      - name: Run backend tests
        working-directory: coro-backend
        run: npx jest --runInBand

      - name: Run PostgreSQL integration tests
        working-directory: coro-backend
        run: npm run test:postgres

      - name: Build backend
        working-directory: coro-backend
        run: npm run build

      - name: Verify durable Knowledge runtime policy
        run: node --test ops/knowledge/*.test.mjs

      - name: Verify synthetic Knowledge corpus and local OCR
        run: node --test qa/knowledge-master/extraction.test.mjs

      - name: Verify compiled Knowledge PDF extraction
        working-directory: coro-backend
        run: node dist/scripts/knowledge-runtime-smoke.js

  client-portal-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coro-client-portal/package-lock.json

      - name: Install dependencies
        working-directory: coro-client-portal
        run: npm ci

      - name: Build client portal
        working-directory: coro-client-portal
        run: npm run build

  build-images:
    if: github.event_name == 'workflow_dispatch'
    needs: [typecheck, backend-tests, client-portal-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      client_portal_digest: ${{ steps.client-portal.outputs.digest }}
      website_digest: ${{ steps.website.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}

      - name: Validate release request
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PRODUCTION_APPROVAL: ${{ inputs.production_approval }}
          MIGRATION_COMPATIBILITY_APPROVAL: ${{ inputs.migration_compatibility_approval }}
        run: node ops/deploy/release-policy.mjs request

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v5
        with:
          context: ./coro-backend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/coro-backend:${{ inputs.release_commit }}

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v5
        with:
          context: ./coro-frontend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/coro-frontend:${{ inputs.release_commit }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.getcoro.io/api
            NEXT_PUBLIC_GLASS_BETA=production-preview

      - name: Build and push website
        id: website
        uses: docker/build-push-action@v5
        with:
          context: ./coro-website
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/coro-website:${{ inputs.release_commit }}

      - name: Build and push client-portal
        id: client-portal
        uses: docker/build-push-action@v5
        with:
          context: ./coro-client-portal
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/coro-client-portal:${{ inputs.release_commit }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.getcoro.io/api
            NEXT_PUBLIC_CLIENT_PORTAL_URL=https://client.getcoro.io
            NEXT_PUBLIC_GLASS_BETA=production-preview

      - name: Verify complete immutable image set
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-backend@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-frontend@${{ steps.frontend.outputs.digest }}
          CLIENT_PORTAL_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-client-portal@${{ steps.client-portal.outputs.digest }}
          WEBSITE_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-website@${{ steps.website.outputs.digest }}
        run: node ops/deploy/release-policy.mjs images

  production-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 60
    environment: production
    concurrency:
      group: coro-production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}

      - name: Validate immutable release evidence
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PRODUCTION_APPROVAL: ${{ inputs.production_approval }}
          MIGRATION_COMPATIBILITY_APPROVAL: ${{ inputs.migration_compatibility_approval }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-backend@${{ needs.build-images.outputs.backend_digest }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-frontend@${{ needs.build-images.outputs.frontend_digest }}
          CLIENT_PORTAL_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-client-portal@${{ needs.build-images.outputs.client_portal_digest }}
          WEBSITE_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-website@${{ needs.build-images.outputs.website_digest }}
        run: node ops/deploy/release-policy.mjs all

      - name: Run fail-closed production release
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PRODUCTION_APPROVAL: ${{ inputs.production_approval }}
          MIGRATION_COMPATIBILITY_APPROVAL: ${{ inputs.migration_compatibility_approval }}
          RELEASE_OPERATOR: ${{ github.actor }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-backend@${{ needs.build-images.outputs.backend_digest }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-frontend@${{ needs.build-images.outputs.frontend_digest }}
          CLIENT_PORTAL_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-client-portal@${{ needs.build-images.outputs.client_portal_digest }}
          WEBSITE_IMAGE: ghcr.io/${{ github.repository_owner }}/coro-website@${{ needs.build-images.outputs.website_digest }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          envs: RELEASE_COMMIT,PRODUCTION_APPROVAL,MIGRATION_COMPATIBILITY_APPROVAL,RELEASE_OPERATOR,BACKEND_IMAGE,FRONTEND_IMAGE,CLIENT_PORTAL_IMAGE,WEBSITE_IMAGE
          script: |
            set -euo pipefail
            trap 'rm -f /tmp/coro-production-release.sh /tmp/coro-release-control.sh /tmp/coro-release-reconcile.sh /tmp/release-state.mjs' EXIT
            test -d /opt/coro-platform/.git
            git -C /opt/coro-platform fetch --quiet origin main
            test "$(git -C /opt/coro-platform rev-parse origin/main)" = "$RELEASE_COMMIT"
            git -C /opt/coro-platform show "$RELEASE_COMMIT:ops/deploy/coro-production-release.sh" > /tmp/coro-production-release.sh
            git -C /opt/coro-platform show "$RELEASE_COMMIT:ops/deploy/coro-release-control.sh" > /tmp/coro-release-control.sh
            git -C /opt/coro-platform show "$RELEASE_COMMIT:ops/deploy/coro-release-reconcile.sh" > /tmp/coro-release-reconcile.sh
            git -C /opt/coro-platform show "$RELEASE_COMMIT:ops/deploy/release-state.mjs" > /tmp/release-state.mjs
            chmod 0700 /tmp/coro-production-release.sh /tmp/coro-release-control.sh /tmp/coro-release-reconcile.sh /tmp/release-state.mjs
            CORO_RELEASE_SCRIPT_SOURCE=/tmp/coro-production-release.sh \
            CORO_RELEASE_STATE_SOURCE=/tmp/release-state.mjs \
            CORO_RELEASE_RECONCILE_SOURCE=/tmp/coro-release-reconcile.sh \
            /tmp/coro-release-control.sh
