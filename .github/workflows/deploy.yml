name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/coro-platform
            git pull
            docker compose build backend frontend website
            docker compose up -d
            docker compose exec -T backend npx prisma@6.19.3 migrate deploy --schema=/app/prisma/schema.prisma