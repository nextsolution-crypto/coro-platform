name: coro-report-qa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coro_report_qa
      POSTGRES_PASSWORD: ${INC_RP_QA_DB_PASSWORD:?set INC_RP_QA_DB_PASSWORD outside Git}
      POSTGRES_DB: coro_report_qa
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coro_report_qa -d coro_report_qa"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: ["postgres:/var/lib/postgresql/data"]

  private-storage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    environment:
      GARAGE_RPC_SECRET: ${INC_RP_QA_GARAGE_RPC_SECRET:?set INC_RP_QA_GARAGE_RPC_SECRET outside Git}
    ports: ["127.0.0.1:59000:3900"]
    configs:
      - source: garage_config
        target: /etc/garage.toml
    volumes: ["storage:/data"]

  clamav:
    image: clamav/clamav:1.4
    ports: ["127.0.0.1:53310:3310"]
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\n' | nc 127.0.0.1 3310 | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s
    volumes: ["clamav:/var/lib/clamav"]

volumes:
  postgres:
  storage:
  clamav:

configs:
  garage_config:
    content: |
      metadata_dir = "/data/meta"
      data_dir = "/data/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "private-storage:3901"

      [s3_api]
      s3_region = "us-east-1"
      api_bind_addr = "[::]:3900"
