name: coro-global-e2e
services:
  private-storage-qa:
    image: node:22-alpine
    command: ["node", "/qa/private-storage-container.mjs"]
    environment:
      PRIVATE_STORAGE_PORT: "34642"
      PRIVATE_STORAGE_ACCESS_KEY: "qa-storage-access"
    volumes:
      - type: bind
        source: ./src
        target: /qa
        read_only: true
    restart: "no"
    networks:
      isolated:
        aliases: [private-storage-qa]
  provider-fake:
    image: node:22-alpine
    command: ["node", "/qa/provider-container.mjs"]
    environment:
      QA_PROVIDER_PORT: "34641"
    ports:
      - "127.0.0.1:${CORO_QA_PROVIDER_PORT:-34641}:34641"
    volumes:
      - type: bind
        source: ./src
        target: /qa
        read_only: true
    restart: "no"
    networks: [isolated, host-loopback]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coro_qa_global_e2e
      POSTGRES_USER: coro_qa
      POSTGRES_PASSWORD: ${CORO_QA_DB_PASSWORD:?required}
    ports:
      - "127.0.0.1:${CORO_QA_POSTGRES_PORT:-55439}:5432"
    volumes:
      - type: bind
        source: ${CORO_QA_POSTGRES_DATA:?D-drive path required}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coro_qa -d coro_qa_global_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
    networks: [isolated, host-loopback]
networks:
  isolated:
    # Application containers use only this network and have no Internet route.
    driver: bridge
    internal: true
  host-loopback:
    # Credential-free infrastructure fakes also join this bridge because
    # Docker Desktop/Windows otherwise does not publish internal-network ports.
    # Application containers must never join this network.
    driver: bridge
