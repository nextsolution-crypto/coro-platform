x-coro-logging: &coro-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: coro_postgres
    restart: unless-stopped
    logging: *coro-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coro_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/nextsolution-crypto/coro-backend:latest
    container_name: coro_backend
    restart: unless-stopped
    logging: *coro-logging
    environment:
      TZ: America/Toronto
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEB_AI_PUBLIC_KNOWLEDGE_ENABLED: ${WEB_AI_PUBLIC_KNOWLEDGE_ENABLED:-false}
      PUBLIC_KNOWLEDGE_DATABASE_URL: ${PUBLIC_KNOWLEDGE_DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      PLATFORM_MFA_SECRET: ${PLATFORM_MFA_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      DEMO_AUTH_EMAIL_LIVE_RECIPIENT_SHA256_ALLOWLIST: ${DEMO_AUTH_EMAIL_LIVE_RECIPIENT_SHA256_ALLOWLIST:-}
      CLIENT_INVITATION_OUTBOX_KEY_BASE64: ${CLIENT_INVITATION_OUTBOX_KEY_BASE64:-}
      CLIENT_INVITATION_OUTBOX_KEY_ID: ${CLIENT_INVITATION_OUTBOX_KEY_ID:-}
      CLIENT_INVITATION_OUTBOX_PREVIOUS_KEYS_BASE64: ${CLIENT_INVITATION_OUTBOX_PREVIOUS_KEYS_BASE64:-{}}
      INCIDENT_OUTBOX_KEY_BASE64: ${INCIDENT_OUTBOX_KEY_BASE64:-}
      INCIDENT_OUTBOX_KEY_ID: ${INCIDENT_OUTBOX_KEY_ID:-v1}
      POPULATION_EMAIL_TIMEOUT_MS: ${POPULATION_EMAIL_TIMEOUT_MS:-10000}
      POPULATION_BREVO_WEBHOOK_SECRET: ${POPULATION_BREVO_WEBHOOK_SECRET}
      POPULATION_BREVO_SMS_WEBHOOK_SECRET: ${POPULATION_BREVO_SMS_WEBHOOK_SECRET}
      BREVO_SMS_SENDER: ${BREVO_SMS_SENDER}
      POPULATION_SMS_PRODUCTION_VALIDATED: ${POPULATION_SMS_PRODUCTION_VALIDATED}
      POPULATION_CONTROLLED_OTP_ENABLED: ${POPULATION_CONTROLLED_OTP_ENABLED:-false}
      POPULATION_CONTROLLED_OTP_EXPIRES_AT: ${POPULATION_CONTROLLED_OTP_EXPIRES_AT:-}
      POPULATION_CONTROLLED_LIVE_TEST_ENABLED: ${POPULATION_CONTROLLED_LIVE_TEST_ENABLED:-false}
      POPULATION_CONTROLLED_LIVE_TEST_STOP: ${POPULATION_CONTROLLED_LIVE_TEST_STOP:-true}
      POPULATION_CONTROLLED_LIVE_TEST_ALERT_ID: ${POPULATION_CONTROLLED_LIVE_TEST_ALERT_ID:-}
      POPULATION_CONTROLLED_LIVE_TEST_EXPIRES_AT: ${POPULATION_CONTROLLED_LIVE_TEST_EXPIRES_AT:-}
      POPULATION_CONTROLLED_LIVE_TEST_ORGANIZATION_ID: ${POPULATION_CONTROLLED_LIVE_TEST_ORGANIZATION_ID:-}
      POPULATION_CONTROLLED_LIVE_TEST_PROGRAM_ID: ${POPULATION_CONTROLLED_LIVE_TEST_PROGRAM_ID:-}
      POPULATION_CONTROLLED_LIVE_TEST_EMAIL_SHA256: ${POPULATION_CONTROLLED_LIVE_TEST_EMAIL_SHA256:-}
      POPULATION_CONTROLLED_LIVE_TEST_SMS_SHA256: ${POPULATION_CONTROLLED_LIVE_TEST_SMS_SHA256:-}
      POPULATION_CONTROLLED_LIVE_TEST_MAX_CAMPAIGN_CAD_CENTS: ${POPULATION_CONTROLLED_LIVE_TEST_MAX_CAMPAIGN_CAD_CENTS:-}
      POPULATION_CONTROLLED_LIVE_TEST_SMS_CANADA_CAD_MICROS_PER_SEGMENT: ${POPULATION_CONTROLLED_LIVE_TEST_SMS_CANADA_CAD_MICROS_PER_SEGMENT:-}
      POPULATION_CONTROLLED_LIVE_TEST_EMAIL_CAD_MICROS_PER_MESSAGE: ${POPULATION_CONTROLLED_LIVE_TEST_EMAIL_CAD_MICROS_PER_MESSAGE:-}
      INCIDENT_REPORTS_ENABLED: ${INCIDENT_REPORTS_ENABLED:-false}
      INCIDENT_REPORT_ATTACHMENTS_ENABLED: ${INCIDENT_REPORT_ATTACHMENTS_ENABLED:-false}
      INCIDENT_REPORT_ARCHIVES_ENABLED: ${INCIDENT_REPORT_ARCHIVES_ENABLED:-false}
      INCIDENT_REPORT_IMPORT_ENABLED: ${INCIDENT_REPORT_IMPORT_ENABLED:-false}
      INCIDENT_REPORT_CLAMAV_HOST: clamav
      INCIDENT_REPORT_CLAMAV_PORT: "3310"
      INCIDENT_REPORT_CLAMAV_TIMEOUT_MS: ${INCIDENT_REPORT_CLAMAV_TIMEOUT_MS:-15000}
      INCIDENT_REPORT_CLAMAV_MAX_SIGNATURE_AGE_HOURS: ${INCIDENT_REPORT_CLAMAV_MAX_SIGNATURE_AGE_HOURS:-48}
      OPERATIONAL_LOG_ENABLED: ${OPERATIONAL_LOG_ENABLED:-false}
      OPERATIONAL_SHIFTS_ENABLED: ${OPERATIONAL_SHIFTS_ENABLED:-false}
      OPERATIONAL_DIRECTIVES_ENABLED: ${OPERATIONAL_DIRECTIVES_ENABLED:-false}
      OPERATIONAL_FOLLOWUPS_ENABLED: ${OPERATIONAL_FOLLOWUPS_ENABLED:-false}
      POPULATION_BREVO_EMAIL_SENDER_VERIFIED: ${POPULATION_BREVO_EMAIL_SENDER_VERIFIED:-false}
      POPULATION_SMS_TFN_APPROVED: ${POPULATION_SMS_TFN_APPROVED:-false}
      POPULATION_OTP_SECRET: ${POPULATION_OTP_SECRET}
      POPULATION_ACCESS_SECRET: ${POPULATION_ACCESS_SECRET}
      POPULATION_ACCESS_REQUEST_TOKEN_SECRET: ${POPULATION_ACCESS_REQUEST_TOKEN_SECRET}
      POPULATION_LOCATION_TOKEN_SECRET: ${POPULATION_LOCATION_TOKEN_SECRET}
      POPULATION_CONTACT_CHANGE_ACTIVE_KEY_ID: ${POPULATION_CONTACT_CHANGE_ACTIVE_KEY_ID}
      POPULATION_CONTACT_CHANGE_ENCRYPTION_KEYS: ${POPULATION_CONTACT_CHANGE_ENCRYPTION_KEYS}
      POPULATION_CONTACT_CHANGE_FINGERPRINT_KEY: ${POPULATION_CONTACT_CHANGE_FINGERPRINT_KEY}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER}
      MAPBOX_GEOCODING_ACCESS_TOKEN: ${MAPBOX_GEOCODING_ACCESS_TOKEN}
      GEOCODING_TIMEOUT_MS: ${GEOCODING_TIMEOUT_MS}
      GEOCODING_CACHE_HMAC_SECRET: ${GEOCODING_CACHE_HMAC_SECRET}
      GEOCODING_CACHE_TTL_SECONDS: ${GEOCODING_CACHE_TTL_SECONDS}
      GEOCODING_CACHE_MAX_ENTRIES: ${GEOCODING_CACHE_MAX_ENTRIES}
      DO_SPACES_KEY: ${DO_SPACES_KEY}
      DO_SPACES_SECRET: ${DO_SPACES_SECRET}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET}
      DO_SPACES_CDN_URL: ${DO_SPACES_CDN_URL}
      PRIVATE_STORAGE_QA_MODE: ${PRIVATE_STORAGE_QA_MODE:-false}
      PRIVATE_STORAGE_QA_ENDPOINT: ${PRIVATE_STORAGE_QA_ENDPOINT:-}
      PRIVATE_STORAGE_QA_ACCESS_KEY: ${PRIVATE_STORAGE_QA_ACCESS_KEY:-}
      PRIVATE_STORAGE_QA_SECRET_KEY: ${PRIVATE_STORAGE_QA_SECRET_KEY:-}
      PRIVATE_STORAGE_QA_BUCKET: ${PRIVATE_STORAGE_QA_BUCKET:-}
      NODE_ENV: production
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coro_network
      - coro_qa_storage_internal
      - coro_clamav_internal
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - type: bind
        source: ${POPULATION_SMS_VALIDATION_EVIDENCE_HOST_DIR:-/var/lib/coro/sms-validation}
        target: /var/lib/coro/sms-validation

  clamav:
    profiles: ["incident-report-untrusted-files"]
    image: clamav/clamav-debian@sha256:6982509b9e1415bf23cb49d0c55872fdd57fd2b92be33fa26d487da42d322076
    container_name: coro_clamav
    restart: unless-stopped
    logging: *coro-logging
    environment:
      CLAMAV_NO_CLAMD: "false"
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMAV_NO_MILTERD: "true"
      CLAMD_STARTUP_TIMEOUT: "900"
      FRESHCLAM_CHECKS: "12"
    mem_limit: 3g
    mem_reservation: 1536m
    cpus: 1.5
    networks:
      - coro_clamav_internal
      - coro_clamav_updates
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      start_period: 15m
      interval: 30s
      timeout: 10s
      retries: 5

  display-pdf-spool-init:
    image: ghcr.io/nextsolution-crypto/coro-backend:latest
    profiles: ["display-pdf-worker"]
    restart: "no"
    command: ["sh", "-c", "chown 1000:1000 /var/lib/coro/display-pdf-spool && chmod 0700 /var/lib/coro/display-pdf-spool"]
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${DISPLAY_PDF_SPOOL_HOST_DIR:-/var/lib/coro/display-pdf-spool}
        target: /var/lib/coro/display-pdf-spool

  display-pdf-worker:
    image: ghcr.io/nextsolution-crypto/coro-backend:latest
    container_name: coro_display_pdf_worker
    profiles: ["display-pdf-worker"]
    restart: unless-stopped
    init: true
    command: ["node", "dist/src/display-pdf-worker/main.js"]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DISPLAY_PDF_WORKER_ENABLED: "true"
      DISPLAY_PDF_SPOOL_DIR: /var/lib/coro/display-pdf-spool
      DO_SPACES_KEY: ${DO_SPACES_KEY}
      DO_SPACES_SECRET: ${DO_SPACES_SECRET}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET}
      PRIVATE_STORAGE_QA_MODE: ${PRIVATE_STORAGE_QA_MODE:-false}
      PRIVATE_STORAGE_QA_ENDPOINT: ${PRIVATE_STORAGE_QA_ENDPOINT:-}
      PRIVATE_STORAGE_QA_ACCESS_KEY: ${PRIVATE_STORAGE_QA_ACCESS_KEY:-}
      PRIVATE_STORAGE_QA_SECRET_KEY: ${PRIVATE_STORAGE_QA_SECRET_KEY:-}
      PRIVATE_STORAGE_QA_BUCKET: ${PRIVATE_STORAGE_QA_BUCKET:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      display-pdf-spool-init:
        condition: service_completed_successfully
    networks:
      - coro_network
      - coro_qa_storage_internal
    volumes:
      - type: bind
        source: ${DISPLAY_PDF_SPOOL_HOST_DIR:-/var/lib/coro/display-pdf-spool}
        target: /var/lib/coro/display-pdf-spool

  display-pdf-rasterizer:
    image: ghcr.io/nextsolution-crypto/coro-backend:latest
    container_name: coro_display_pdf_rasterizer
    profiles: ["display-pdf-worker"]
    restart: unless-stopped
    init: true
    command: ["node", "dist/src/display-pdf-rasterizer/main.js"]
    user: "1000:1000"
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1.0
    environment:
      DISPLAY_PDF_RASTERIZER_ENABLED: "true"
      DISPLAY_PDF_SPOOL_DIR: /var/lib/coro/display-pdf-spool
      NODE_ENV: production
    depends_on:
      display-pdf-spool-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${DISPLAY_PDF_SPOOL_HOST_DIR:-/var/lib/coro/display-pdf-spool}
        target: /var/lib/coro/display-pdf-spool

  frontend:
    image: ghcr.io/nextsolution-crypto/coro-frontend:latest
    container_name: coro_frontend
    restart: unless-stopped
    logging: *coro-logging
    environment:
      TZ: America/Toronto
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - coro_network
    ports:
      - "127.0.0.1:3000:3000"

  website:
    image: ghcr.io/nextsolution-crypto/coro-website:latest
    container_name: coro_website
    restart: unless-stopped
    logging: *coro-logging
    environment:
      TZ: America/Toronto
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.getcoro.io/api
      INTERNAL_API_URL: http://coro_backend:3002/api
    networks:
      - coro_network
    ports:
      - "127.0.0.1:3001:3001"

  client-portal:
    image: ghcr.io/nextsolution-crypto/coro-client-portal:latest
    container_name: coro_client_portal
    restart: unless-stopped
    logging: *coro-logging
    environment:
      TZ: America/Toronto
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.getcoro.io/api
      NEXT_PUBLIC_CLIENT_PORTAL_URL: https://client.getcoro.io
    networks:
      - coro_network
    ports:
      - "127.0.0.1:3003:3003"

  private-storage-qa:
    image: dxflrs/garage@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: coro_private_storage_qa
    logging: *coro-logging
    profiles: ["qa-storage"]
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    environment:
      GARAGE_RPC_SECRET: ${PRIVATE_STORAGE_QA_RPC_SECRET:-}
    configs:
      - source: private_storage_qa_config
        target: /etc/garage.toml
    volumes:
      - private_storage_qa_data:/var/lib/garage
    networks:
      - coro_qa_storage_internal
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
  clamav_signatures:
  private_storage_qa_data:

networks:
  coro_network:
    driver: bridge
  coro_qa_storage_internal:
    driver: bridge
    internal: true
  coro_clamav_internal:
    driver: bridge
    internal: true
  coro_clamav_updates:
    driver: bridge

configs:
  private_storage_qa_config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "private-storage-qa:3901"

      [s3_api]
      s3_region = "us-east-1"
      api_bind_addr = "[::]:3900"
