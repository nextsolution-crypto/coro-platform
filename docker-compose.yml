services:
  postgres:
    image: postgres:16-alpine
    container_name: coro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coro_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/nextsolution-crypto/coro-backend:latest
    container_name: coro_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      POPULATION_EMAIL_TIMEOUT_MS: ${POPULATION_EMAIL_TIMEOUT_MS:-10000}
      POPULATION_BREVO_WEBHOOK_SECRET: ${POPULATION_BREVO_WEBHOOK_SECRET}
      BREVO_SMS_SENDER: ${BREVO_SMS_SENDER}
      POPULATION_SMS_PRODUCTION_VALIDATED: ${POPULATION_SMS_PRODUCTION_VALIDATED}
      POPULATION_OTP_SECRET: ${POPULATION_OTP_SECRET}
      POPULATION_ACCESS_SECRET: ${POPULATION_ACCESS_SECRET}
      POPULATION_ACCESS_REQUEST_TOKEN_SECRET: ${POPULATION_ACCESS_REQUEST_TOKEN_SECRET}
      POPULATION_LOCATION_TOKEN_SECRET: ${POPULATION_LOCATION_TOKEN_SECRET}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER}
      MAPBOX_GEOCODING_ACCESS_TOKEN: ${MAPBOX_GEOCODING_ACCESS_TOKEN}
      GEOCODING_TIMEOUT_MS: ${GEOCODING_TIMEOUT_MS}
      GEOCODING_CACHE_HMAC_SECRET: ${GEOCODING_CACHE_HMAC_SECRET}
      GEOCODING_CACHE_TTL_SECONDS: ${GEOCODING_CACHE_TTL_SECONDS}
      GEOCODING_CACHE_MAX_ENTRIES: ${GEOCODING_CACHE_MAX_ENTRIES}
      DO_SPACES_KEY: ${DO_SPACES_KEY}
      DO_SPACES_SECRET: ${DO_SPACES_SECRET}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET}
      DO_SPACES_CDN_URL: ${DO_SPACES_CDN_URL}
      NODE_ENV: production
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coro_network
    ports:
      - "3002:3002"

  frontend:
    image: ghcr.io/nextsolution-crypto/coro-frontend:latest
    container_name: coro_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - coro_network
    ports:
      - "3000:3000"

  website:
    image: ghcr.io/nextsolution-crypto/coro-website:latest
    container_name: coro_website
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.getcoro.io/api
      INTERNAL_API_URL: http://coro_backend:3002/api
    networks:
      - coro_network
    ports:
      - "3001:3001"

  client-portal:
    image: ghcr.io/nextsolution-crypto/coro-client-portal:latest
    container_name: coro_client_portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.getcoro.io/api
    networks:
      - coro_network
    ports:
      - "3003:3003"

volumes:
  postgres_data:

networks:
  coro_network:
    driver: bridge
